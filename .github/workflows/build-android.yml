name: Build Mobile APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Generate app icons
      run: flutter pub run flutter_launcher_icons
      
    - name: Analyze mobile code
      run: flutter analyze lib/main_mobile.dart
      
    - name: Build mobile debug APK
      run: flutter build apk --debug -t lib/main_mobile.dart
      
    - name: Build mobile release APK
      run: flutter build apk --release -t lib/main_mobile.dart
      
    - name: Build mobile App Bundle
      run: flutter build appbundle --release -t lib/main_mobile.dart
      
    - name: Upload mobile debug APK
      uses: actions/upload-artifact@v4
      with:
        name: mobile-debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
        
    - name: Upload mobile release APK
      uses: actions/upload-artifact@v4
      with:
        name: mobile-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        
    - name: Upload mobile App Bundle
      uses: actions/upload-artifact@v4
      with:
        name: mobile-app-bundle
        path: build/app/outputs/bundle/release/app-release.aab