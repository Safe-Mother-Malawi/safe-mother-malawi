name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.6'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build APK
      run: flutter build apk --release -t lib/main_mobile.dart --split-per-abi
      
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-apks
        path: |
          build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          build/app/outputs/flutter-apk/app-x86_64-release.apk
        retention-days: 30
        
    - name: Create Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          ## Safe Mother Malawi - Mobile App Release
          
          ### What's Included:
          - ✅ Prenatal & Neonatal features
          - ✅ IVR Simulator
          - ✅ Health facilities (1000+)
          - ✅ Real-time alerts
          - ✅ Appointments
          - ✅ Health assessments
          
          ### Backend:
          - Production: https://backend-gsgb.onrender.com
          
          ### Installation:
          1. Download the APK for your device:
             - **arm64-v8a** - Most modern phones (2019+)
             - **armeabi-v7a** - Older phones
             - **x86_64** - Emulators
          2. Enable "Install from Unknown Sources"
          3. Install and open "Safe Mother Malawi"
          
          ### Default Accounts:
          - Admin: admin@safemothermalawi.mw / Admin@123
          - DHO: dho@safemothermalawi.mw / Dho@123
        files: |
          build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          build/app/outputs/flutter-apk/app-x86_64-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
