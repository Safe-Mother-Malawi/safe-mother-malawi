<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#2196F3" rx="80"/>
  
  <!-- Woman figure -->
  <g fill="white">
    <!-- Head -->
    <circle cx="256" cy="180" r="50"/>
    
    <!-- Body -->
    <rect x="216" y="220" width="80" height="120" rx="20"/>
    
    <!-- Arms -->
    <rect x="186" y="240" width="20" height="70" rx="10"/>
    <rect x="306" y="240" width="20" height="70" rx="10"/>
  </g>
  
  <!-- Baby -->
  <circle cx="276" cy="270" r="18" fill="#FFB74D"/>
  
  <!-- Heart -->
  <g fill="#E91E63">
    <circle cx="230" cy="260" r="8"/>
    <circle cx="242" cy="260" r="8"/>
    <polygon points="222,265 250,265 236,280"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="420" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="bold">Safe Mother</text>
</svg>